<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/company-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InvoiceFlow — Professional GST-compliant invoice generator for Indian freelancers. Create PDF invoices, manage clients, and track payments in minutes." />
    <meta name="keywords" content="invoice generator, GST invoice, freelancer invoice, India, PDF invoice" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <title>InvoiceFlow — Invoice Generator for Indian Freelancers</title>
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #0b0f19; }
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: 'Inter', sans-serif;
          color: #fff;
        }
        .spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(255, 255, 255, 0.1);
          border-left-color: #3b82f6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 24px;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .loader-text {
          font-size: 1.25rem;
          font-weight: 600;
          letter-spacing: 0.5px;
          margin-bottom: 8px;
        }
        .loader-subtext {
          font-size: 0.875rem;
          color: #94a3b8;
        }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">InvoiceFlow</div>
        <div class="loader-subtext">Loading your workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
